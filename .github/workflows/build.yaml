# github workflow for building this package
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    push-build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup mise
              uses: jdx/mise-action@v2
              with:
                install: true         # run `mise install`
                cache: true           # enable caching
                experimental: true    # optional: enable experimental features

            - name: Verify node installation
              run: node --version

            - name: Verify yarn installation
              run: yarn --version

            - name: Install dependencies
              run: yarn install

            - name: Build
              run: gulp dist
